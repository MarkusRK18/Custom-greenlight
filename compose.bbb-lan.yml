# Opt in with --env-file local-bbb/lan.env; bind only to the selected LAN address.
services:
  bigbluebutton:
    environment:
      LOCAL_BBB_LAN_IP: ${LOCAL_BBB_LAN_IP:?Run scripts/enable-local-wifi.sh first}
      LOCAL_BBB_LAN_SUBNET: ${LOCAL_BBB_LAN_SUBNET:?Run scripts/enable-local-wifi.sh first}
    ports:
      - '${LOCAL_BBB_LAN_IP}:443:443/tcp'
      - '${LOCAL_BBB_LAN_IP}:8443:8443/tcp'
      - '${LOCAL_BBB_LAN_IP}:8080:8080/tcp'
      - '${LOCAL_BBB_LAN_IP}:16384-16447:16384-16447/udp'
      - '${LOCAL_BBB_LAN_IP}:20000-20127:20000-20127/udp'
